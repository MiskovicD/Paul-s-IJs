<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Whoop &mdash; verhuisd</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<!-- Werkt ook zonder JavaScript. -->
<meta http-equiv="refresh" content="2;url=https://miskovicd.github.io/whoop-tracker/app/">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0c0e;
  color:#f2f3f5;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
.kaart{max-width:340px;margin:20px;padding:26px;text-align:center;background:#16181c;
  border:1px solid #26292e;border-radius:16px}
h1{font-size:12.5px;letter-spacing:.15em;margin:0 0 14px;color:#8b9199}
p{margin:0 0 16px;color:#8b9199;font-size:14px}
a{display:block;padding:13px;border-radius:11px;background:#f2f3f5;color:#000;
  font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="kaart">
  <h1>WHOOP</h1>
  <p>Deze app heeft een eigen adres gekregen. Je wordt doorgestuurd.</p>
  <a href="https://miskovicd.github.io/whoop-tracker/app/">Nu openen</a>
  <p style="margin:16px 0 0;font-size:12.5px">Zet hem opnieuw op je beginscherm,
    dan hoef je hier niet meer langs.</p>
</div>
<script>
// De oude service worker had deze map als scope. Laat je die staan, dan blijft
// hij op de achtergrond bestanden ophalen die er niet meer zijn. Opruimen en
// dan pas doorsturen.
(async () => {
  const nieuw = "https://miskovicd.github.io/whoop-tracker/app/";
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  } catch (e) {}
  location.replace(nieuw);
})();
</script>
</body>
</html>
